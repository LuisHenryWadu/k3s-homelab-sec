apiVersion: v1
kind: Namespace
metadata:
  name: security-lab
  labels:
    purpose: security-testing
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: security-lab-quota
  namespace: security-lab
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: security-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
