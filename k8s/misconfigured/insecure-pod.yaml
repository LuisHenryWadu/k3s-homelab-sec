apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
  namespace: security-lab
  labels:
    app: security-experiment
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: insecure-container
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

